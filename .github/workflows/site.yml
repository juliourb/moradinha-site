name: site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências Node
        run: npm ci

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.11.9"

      - name: Validar os pacotes do catálogo (contrato v1)
        run: |
          npm run validar -- pacotes/al_rm_maceio/ficticio
          npm run validar -- pacotes/teste_pequeno/ficticio

      - name: Testes de unidade (vitest)
        run: npm test

      - name: Build (esbuild + quarto render)
        run: npm run build

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes fim a fim + axe-core (Playwright)
        run: npm run test:e2e

      - name: Publicar capturas de tela (relatorios/)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios
          path: relatorios/

      - name: Empacotar o site para o GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Ponto de parada da F0 (SPEC_00 §9/§10): este job fica desligado (if: false)
  # até Julio ativar o GitHub Pages (Settings → Pages → Source: GitHub Actions)
  # e confirmar. Depois disso, trocar `if: false` por
  # `if: github.ref == 'refs/heads/main' && github.event_name == 'push'`.
  deploy:
    needs: build
    if: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
