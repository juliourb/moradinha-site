name: site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências Node
        run: npm ci

      - uses: quarto-dev/quarto-actions/setup@v2.2.0
        with:
          version: "1.11.9"

      - name: Montar o catálogo (valida V1–V12 em todo pacote de pacotes/; o catalogo.json não é versionado e sai impresso no log)
        run: npm run catalogo

      - name: "Validar o catalogo.json (F5-2: só pacote real fora de teste_apenas)"
        run: npm run validar:catalogo-publico

      - name: Validar citações da Metodologia (referencias.bib)
        run: npm run validar:citacoes

      - name: Testes de unidade (vitest)
        run: npm test

      - name: Build público (esbuild + quarto render)
        run: npm run build

      - name: Build interno (--profile interno, só para a checagem F4-4)
        run: npm run build:interno

      - name: Validar a seção interna (ausente no público, presente no --profile interno)
        run: npm run validar:build-interno

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes fim a fim + axe-core (Playwright)
        run: npm run test:e2e

      - name: Publicar capturas de tela (relatorios/)
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: relatorios
          path: relatorios/

      - name: Empacotar o site para o GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  # GitHub Pages ativado por Julio (Settings → Pages → Source: GitHub Actions) —
  # fim da parada obrigatória da F0.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
